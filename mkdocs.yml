site_name: GPT-2 from scratch on FineWeb-Edu
site_description: Ordering a fixed FineWeb-Edu corpus by its classifier score, for GPT-2 pretraining.
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Experiment: experiment.md
  - Usage: usage.md
  - Architecture: architecture.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
