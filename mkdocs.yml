site_name: GPT-2 curriculum learning on FineWeb-Edu
site_description: Does the order of documents change what GPT-2 learns? Four curricula over one FineWeb-Edu pool.
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Experiment: experiment.md
  - Usage: usage.md
  - Architecture: architecture.md
  - Grid'5000: grid5000.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
